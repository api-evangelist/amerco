description: >-
  AMERCO (U-Haul Holding Company) publishes NO pricing for API access. The WebSelfStorage
  Affiliate API is a benefit of the U-Haul Self-Storage Affiliate Network relationship, not a
  metered product: there are no request quotas, no tiers, no overage rate and no self-service
  sign-up. What AMERCO does publish are flat monthly service fees for the WebSelfStorage
  platform the API sits on, recorded below verbatim so a buyer can see the real commercial
  shape.
