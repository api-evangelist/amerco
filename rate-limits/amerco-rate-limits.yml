note: >-
  REPLACES the 2026-05-04 bulk-sweep scaffold, which asserted 10/100/1000 rpm tiers AMERCO has
  never published. Those numbers were invented and are removed.
description: >-
  AMERCO publishes no rate limits for the WebSelfStorage Affiliate API, and the production host
  emits no rate-limit headers. An honest zero.
limit_count: 0
limits: []
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
responseCodes:
  throttled: null
evidence:
- probe: GET https://api.webselfstorage.com/v4/test (no Authorization header)
  http_status: 401
  rate_limit_headers_present: false
  headers_observed:
  - Content-Type
  - Request-Context
  - Content-Security-Policy
  - X-WssApi-Environment
  - X-WssApi-Hostname
  - X-WssApi-Version
  - Server-Timing
  - Set-Cookie
  - X-XSS-Protection
  - X-Content-Type-Options
  - Strict-Transport-Security
  note: >-
    No X-RateLimit-*, no RateLimit-*, no Retry-After. Only an authenticated call could confirm
    whether limits are enforced silently, and API Evangelist holds no affiliate key.
- probe: openapi/amerco-webselfstorage-affiliate-api-v4-openapi.yml
  finding: No 429 response is declared on any of the 13 operations.
- probe: https://api.webselfstorage.com/
  http_status: 200
  finding: Swagger UI only; no rate-limit or fair-use documentation.
gap: >-
  An agent calling this API cannot tell whether it is approaching a limit, cannot learn when it
  may retry, and has no declared 429 to handle. Publishing RateLimit-Limit / RateLimit-Remaining
  / RateLimit-Reset and a documented 429 would be the cheapest runtime-semantics improvement
  available to this contract.
