    type: boolean
  - name: errorMessage
    type: string
  extended_schema: InvalidParameterResult
  extended_members:
  - name: parameter
    type: string
    description: The request member that failed validation.
  - name: reason
    type: string
    description: Why that member was rejected.
  gateway_envelope:
    observed_on: 401
    content_type: application/problem+json
    body_shape: >-
      {"Value":{"Success":<bool>,"ErrorMessage":"<string>"},"Formatters":[],"ContentTypes":[],"DeclaredType":null,"StatusCode":<int>}
    warning: >-
      This is an ASP.NET ObjectResult serialization, not an RFC 9457 problem document, despite
      the application/problem+json content type. It also uses PascalCase members (Success,
      ErrorMessage) where the in-contract envelope uses camelCase (success, errorMessage). A
      client that parses one shape will fail on the other.

