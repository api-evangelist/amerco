apis:
- aid: amerco:uhaul
  name: U-Haul
  description: U-Haul provides do-it-yourself moving and storage services including truck and trailer
    rentals, self-storage, moving supplies, and U-Box portable storage containers. Partners access dealer
    management tools via the U-Haul dealer portal and self-storage affiliates use WebSelfStorage management
    software.
  humanURL: https://www.uhaul.com/
  baseURL: https://www.uhaul.com
  x-base-url-note: 'www.uhaul.com is the production host for the U-Haul consumer and dealer web surface,
    not an API host. U-Haul publishes no API base URL for truck rental, U-Box, Moving Help or the dealer
    program — probed 2026-09-02: api.uhaul.com and developer.uhaul.com do not resolve, and www.uhaul.com/openapi.json,
    /swagger.json, /api-docs and /llms.txt all return HTTP 404. Recorded honestly rather than guessed.
    The one AMERCO API with a real base is the WebSelfStorage Affiliate API at https://api.webselfstorage.com.'
